# Builds + publishes binge-server release artefacts on every v*.*.* tag.
#
# Two parallel jobs:
#   - binaries: cross-compile for darwin/{arm64,amd64}, linux/{amd64,arm64},
#     windows/amd64 and attach to GitHub Releases.
#   - docker: build a multi-arch image and push to ghcr.io as
#     ghcr.io/ordureconnoisseur/binge-server:vX.Y.Z + :latest.
#
# To cut a release: `git tag v0.1.0 && git push --tags`.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # for GitHub Releases
  packages: write   # for ghcr.io push

jobs:
  # Creates the release ONCE, before any uploader runs.
  #
  # Previously all five matrix jobs called action-gh-release with
  # generate_release_notes, so each raced to create the same release. Two
  # things broke on v0.2.0: one job lost the race outright ("Resource not
  # accessible by integration" — the darwin/arm64 binary was missing until
  # a manual re-run), and the generated notes overwrote the annotated tag
  # message, so the release page showed a duplicated "Full Changelog" line
  # instead of the security + upgrade notice. Create it here, upload to it
  # below.
  create_release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the tag object for its annotation

      # The annotated tag message IS the release notes — it's written
      # deliberately at tag time and says more than generated notes can.
      - name: Build release notes from the tag annotation
        run: |
          # actions/checkout materialises the pushed tag as a LIGHTWEIGHT
          # ref, even at fetch-depth 0. On a lightweight tag %(contents)
          # silently yields the tagged COMMIT's message instead of the
          # annotation, which is how v0.2.1 shipped with a commit message
          # as its release notes. Re-fetch the tag explicitly to get the
          # real tag object.
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true

          # Only an annotated tag has a tag object; anything else means the
          # notes would be a commit message wearing a release's clothes, so
          # say so loudly rather than shipping it quietly again.
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > NOTES.md
          else
            echo "::warning::${GITHUB_REF_NAME} is not an annotated tag - release notes fall back to the commit message. Tag with 'git tag -a' to write real notes."
            git log -1 --format='%B' > NOTES.md
          fi

          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            echo "" >> NOTES.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}" >> NOTES.md
          fi
          cat NOTES.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md

  binaries:
    name: build binary (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/binge-server${{ matrix.ext }}" .

      - name: Pack archive
        run: |
          NAME="binge-server_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          STAGE="release/${NAME}"
          mkdir -p "${STAGE}"
          cp "dist/binge-server${{ matrix.ext }}" "${STAGE}/"
          cp README.md LICENSE "${STAGE}/"
          cd release
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../${NAME}.zip" "${NAME}"
          else
            tar -czvf "../${NAME}.tar.gz" "${NAME}"
          fi

      # Attach assets only. The release already exists (needs:
      # create_release) and its notes are already correct, so neither
      # generate_release_notes nor a body is set here — that's what
      # clobbered the tag annotation before.
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binge-server_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            binge-server_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  checksums:
    name: publish SHA256SUMS
    runs-on: ubuntu-latest
    # After every binary is attached, so the file covers the whole set.
    needs: binaries
    permissions:
      contents: write
    steps:
      - name: Hash the published assets and attach the list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sums && cd sums
          # Hash what is actually on the release rather than a local
          # rebuild, so the file describes the bytes users download.
          gh release download "${GITHUB_REF_NAME}"             --repo "${GITHUB_REPOSITORY}"             --pattern 'binge-server_*' --dir .
          sha256sum binge-server_* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS             --repo "${GITHUB_REPOSITORY}" --clobber

  docker:
    name: docker image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ref }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
